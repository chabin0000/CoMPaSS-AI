run_name: argos-tiny-local-dry-run
condition: S3b
base_model: artifacts/student_dry_run_final/tiny-base
dataset: artifacts/student_dry_run_final/toy-s3b.jsonl
evaluation_dataset: evaluation/student/toy_eval.jsonl
output_dir: artifacts/student_dry_run_final/run
training_enabled: true
seed: 17
epochs: 1
learning_rate: 0.001
batch_size: 1
gradient_accumulation_steps: 1
max_sequence_length: 64
lora_rank: 2
lora_alpha: 4
lora_dropout: 0.0
target_modules: [c_attn]
fp16: false
bf16: false
quantization_mode: none
allow_quantization_fallback: true
max_steps: 1
dry_run:
  source_dataset: tests/fixtures/student_teacher_verified.jsonl
